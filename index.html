<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050506">
<title>Controle de Frequência</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Controle de Frequência">
<meta property="og:description" content="Registre presença e acompanhe sua frequência por matéria.">
<meta property="og:image" content="https://daviboiverde.github.io/frequencia-da-faculdade/og-image.png">
<meta property="og:url" content="https://daviboiverde.github.io/frequencia-da-faculdade/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Controle de Frequência">
<meta name="twitter:description" content="Registre presença e acompanhe sua frequência por matéria.">
<meta name="twitter:image" content="https://daviboiverde.github.io/frequencia-da-faculdade/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506;
    --bg2:#0a0a0c;
    --card:#0d0e12;
    --card2:#15161d;
    --line:rgba(255,255,255,.08);
    --txt:#ededef;
    --muted:#8a8f98;
    --accent:#818cf8;      /* indigo — tema cinema dark */
    --accent2:#5e6ad2;
    --accent-glow:rgba(94,106,210,.35);
    --green:#22c55e;
    --yellow:#f59e0b;
    --red:#ef4444;
    --blue:#3b82f6;
    --radius:16px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    background-image:radial-gradient(circle at 20% -10%,rgba(94,106,210,.14),transparent 45%),
                      radial-gradient(circle at 90% 0%,rgba(94,106,210,.08),transparent 40%);
    background-attachment:fixed;
    color:var(--txt);
    padding-bottom:92px;
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;touch-action:manipulation;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* ===== HEADER ===== */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(5,5,6,.78);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);
    padding:16px 18px 14px;
  }
  header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px}
  header .sub{color:var(--muted);font-size:12.5px;margin-top:3px}

  /* ===== VIEW TOGGLE ===== */
  .viewToggle{
    display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);
    border-radius:12px;padding:3px;margin-top:14px;
  }
  .viewToggle button{
    flex:1;background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:700;
    padding:8px;border-radius:9px;transition:background .25s var(--ease),color .25s var(--ease);
  }
  .viewToggle button.active{background:var(--accent);color:#0b0b14}

  /* ===== DATE BAR ===== */
  .datebar{
    display:flex;align-items:center;gap:8px;margin-top:10px;
  }
  .datebar button{
    background:var(--card2);border:1px solid var(--line);color:var(--txt);
    width:40px;height:40px;border-radius:12px;font-size:18px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .15s var(--ease),background .15s;
  }
  .datebar button:active{transform:scale(.92);background:var(--card)}
  .datebar .dateinfo{
    flex:1;text-align:center;background:var(--card2);border:1px solid var(--line);
    border-radius:12px;padding:7px 8px;position:relative;overflow:hidden;
  }
  .datebar .dateinfo .day{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .datebar .dateinfo .weekday{font-size:11.5px;color:var(--accent);text-transform:capitalize;font-weight:600}
  .datebar .dateinfo input[type=date]{
    position:absolute;inset:0;opacity:0;width:100%;height:100%;
  }
  .today-btn{
    text-align:center;margin-top:10px;
  }
  .today-btn button{
    background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;
    padding:4px 8px;
  }

  /* ===== PAGES ===== */
  .page{display:none;padding:14px 16px 20px}
  .page.active{display:block}

  /* ===== DAY GROUP ===== */
  .daygroup{margin-bottom:20px}
  .daygroup .dayhead{
    display:flex;align-items:center;gap:8px;margin:0 2px 10px;
    font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
  }
  .daygroup .dayhead .pill{
    background:var(--accent);color:#0b0b14;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800;
  }
  .daygroup.is-today .dayhead{color:var(--accent)}

  /* ===== CLASS CARD ===== */
  .cls{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;margin-bottom:11px;position:relative;
    box-shadow:inset 3px 0 0 var(--accent);
    transition:box-shadow .2s var(--ease);
  }
  .cls .name{font-size:15px;font-weight:700;line-height:1.3;padding-right:72px}
  .cls .type{font-size:11.5px;color:var(--muted);margin-top:3px}
  .cls .time{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px}
  .cls .time svg{width:13px;height:13px;flex-shrink:0}
  .cls .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
  .cls .btns button{
    border:1px solid var(--line);background:var(--card2);color:var(--muted);
    padding:10px 4px;border-radius:12px;font-size:11.5px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    transition:transform .12s var(--ease),background .15s,color .15s,border-color .15s;
    min-height:52px;
  }
  .cls .btns button svg{width:18px;height:18px}
  .cls .btns button:active{transform:scale(.94)}
  .cls.present{box-shadow:inset 3px 0 0 var(--green)}
  .cls.absent{box-shadow:inset 3px 0 0 var(--red)}
  .cls.neutral{box-shadow:inset 3px 0 0 var(--muted)}
  .cls .btns button.sel-p{background:rgba(34,197,94,.14);border-color:var(--green);color:var(--green)}
  .cls .btns button.sel-a{background:rgba(239,68,68,.14);border-color:var(--red);color:var(--red)}
  .cls .btns button.sel-n{background:rgba(138,143,152,.14);border-color:var(--muted);color:var(--txt)}
  .cls .status-tag{
    position:absolute;top:14px;right:15px;font-size:10.5px;font-weight:800;
    padding:3px 9px;border-radius:999px;display:none;letter-spacing:.2px;
  }
  .cls.present .status-tag{display:inline-block;background:rgba(34,197,94,.15);color:var(--green)}
  .cls.absent .status-tag{display:inline-block;background:rgba(239,68,68,.15);color:var(--red)}
  .cls.neutral .status-tag{display:inline-block;background:rgba(139,149,167,.18);color:var(--muted)}

  .empty-day{
    text-align:center;color:var(--muted);font-size:13px;padding:32px 10px;
    background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  }

  /* ===== PERFECT WEEK BUTTON ===== */
  .perfect-week-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;color:#fff;
    padding:14px;border-radius:var(--radius);font-size:14px;font-weight:800;margin-bottom:18px;
    box-shadow:0 8px 24px var(--accent-glow);transition:transform .12s var(--ease);
  }
  .perfect-week-btn svg{width:18px;height:18px}
  .perfect-week-btn:active{transform:scale(.97)}

  /* ===== CONFIRM MODAL ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;z-index:80;
    opacity:0;pointer-events:none;
  }
  .modal-card{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:32px 28px;text-align:center;max-width:280px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .modal-check{
    width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,.15);color:var(--green);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  }
  .modal-title{font-size:17px;font-weight:800}
  .modal-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}

  /* ===== STATS ===== */
  .overview{
    background:linear-gradient(155deg,rgba(94,106,210,.16) 0%,var(--card) 55%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:18px;
  }
  .overview h2{margin:0 0 12px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .ov-grid{display:flex;gap:10px}
  .ov-item{flex:1;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
  .ov-item .num{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
  .ov-item .lbl{font-size:11px;color:var(--muted);margin-top:2px}
  .ov-big{font-size:36px;font-weight:900;text-align:center;margin:4px 0 4px;font-variant-numeric:tabular-nums}
  .ov-big small{font-size:15px;color:var(--muted);font-weight:600}

  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;margin-bottom:12px;transition:transform .12s var(--ease),border-color .15s;
  }
  .stat:active{transform:scale(.98);border-color:var(--accent)}
  .stat .tap-hint{font-size:10.5px;color:var(--muted);margin-top:10px;opacity:.7}
  .stat .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .stat .top .mname{font-size:15px;font-weight:700;line-height:1.3}
  .stat .top .pct{font-size:21px;font-weight:900;flex-shrink:0;font-variant-numeric:tabular-nums}
  .stat .bar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin:12px 0 10px;border:1px solid var(--line)}
  .stat .bar > div{height:100%;border-radius:999px;transition:width .5s var(--ease),background .3s}
  .stat .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
  .stat .meta b{color:var(--txt);font-variant-numeric:tabular-nums}
  .stat .situ{font-size:11.5px;font-weight:700;margin-top:9px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px}
  .situ.g{background:rgba(34,197,94,.13);color:var(--green)}
  .situ.y{background:rgba(245,158,11,.13);color:var(--yellow)}
  .situ.r{background:rgba(239,68,68,.13);color:var(--red)}
  .situ.n{background:var(--card2);color:var(--muted)}

  /* ===== TABBAR ===== */
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:520px;
    display:flex;background:rgba(8,8,10,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1;background:none;border:none;color:var(--muted);padding:12px 4px 10px;
    font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:color .15s;
  }
  .tabbar button svg{width:22px;height:22px;transition:transform .15s var(--ease)}
  .tabbar button.active{color:var(--accent)}
  .tabbar button.active svg{transform:translateY(-1px)}
  .tabbar button:active svg{transform:scale(.9)}

  /* ===== TOAST ===== */
  .toast{
    position:fixed;bottom:96px;left:50%;
    background:var(--txt);color:#0b0b0d;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;z-index:50;box-shadow:0 12px 34px rgba(0,0,0,.5);
  }

  /* ===== TOOLS ===== */
  .tools{display:flex;gap:9px;margin-top:6px}
  .tools button{
    flex:1;background:var(--card2);border:1px solid var(--line);color:var(--muted);
    padding:11px;border-radius:12px;font-size:12.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s var(--ease);
  }
  .tools button svg{width:15px;height:15px}
  .tools button:active{transform:scale(.96)}

  /* ===== AGENDA ===== */
  .agenda-cls{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;margin-bottom:11px;position:relative;
    box-shadow:inset 3px 0 0 var(--accent);
  }
  .agenda-cls.now{box-shadow:inset 3px 0 0 var(--green)}
  .agenda-cls .name{font-size:15px;font-weight:700;line-height:1.3;padding-right:64px}
  .agenda-cls .type{font-size:11.5px;color:var(--muted);margin-top:3px}
  .agenda-cls .time{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px}
  .agenda-cls .time svg{width:13px;height:13px;flex-shrink:0}
  .agenda-cls .now-tag{
    position:absolute;top:14px;right:15px;font-size:10.5px;font-weight:800;
    padding:3px 9px;border-radius:999px;background:rgba(34,197,94,.15);color:var(--green);
    letter-spacing:.2px;
  }
  .room-row{display:flex;gap:8px;margin-top:12px}
  .room-chip{
    flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:9px 10px;display:flex;align-items:center;gap:8px;
  }
  .room-chip svg{width:16px;height:16px;color:var(--accent);flex-shrink:0}
  .room-chip .rc-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .room-chip .rc-val{font-size:13.5px;font-weight:700}

  /* ===== PROVAS ===== */
  .add-exam-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;color:#fff;
    padding:14px;border-radius:var(--radius);font-size:14px;font-weight:800;margin-bottom:18px;
    box-shadow:0 8px 24px var(--accent-glow);transition:transform .12s var(--ease);
  }
  .add-exam-btn svg{width:18px;height:18px}
  .add-exam-btn:active{transform:scale(.97)}

  .exam-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;margin-bottom:11px;position:relative;
    box-shadow:inset 3px 0 0 var(--muted);
  }
  .exam-card.c-red{box-shadow:inset 3px 0 0 var(--red)}
  .exam-card.c-yellow{box-shadow:inset 3px 0 0 var(--yellow)}
  .exam-card.c-green{box-shadow:inset 3px 0 0 var(--green)}
  .exam-card .name{font-size:15px;font-weight:700;line-height:1.3;padding-right:88px}
  .exam-card .type-badge{
    display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;
    margin-top:6px;letter-spacing:.2px;
  }
  .exam-card .type-badge.prova{background:rgba(239,68,68,.15);color:var(--red)}
  .exam-card .type-badge.atividade{background:rgba(59,130,246,.15);color:var(--blue)}
  .exam-card .note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.4}
  .exam-card .exam-date{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:5px}
  .exam-card .exam-date svg{width:13px;height:13px;flex-shrink:0}
  .exam-card .countdown{
    position:absolute;top:14px;right:15px;font-size:10.5px;font-weight:800;
    padding:3px 9px;border-radius:999px;letter-spacing:.2px;display:flex;align-items:center;gap:5px;
  }
  .exam-card .countdown .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .exam-card .countdown.c-red{background:rgba(239,68,68,.15);color:var(--red)}
  .exam-card .countdown.c-red .dot{background:var(--red)}
  .exam-card .countdown.c-yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
  .exam-card .countdown.c-yellow .dot{background:var(--yellow)}
  .exam-card .countdown.c-green{background:rgba(34,197,94,.15);color:var(--green)}
  .exam-card .countdown.c-green .dot{background:var(--green)}
  .exam-card .card-actions{display:flex;gap:4px;position:absolute;bottom:12px;right:12px}
  .exam-card .card-actions button{
    background:none;border:none;color:var(--muted);padding:6px;border-radius:8px;transition:color .15s;
  }
  .exam-card .card-actions button svg{width:15px;height:15px}
  .exam-card .card-actions .edit-btn:active{color:var(--accent)}
  .exam-card .card-actions .del-btn:active{color:var(--red)}

  /* ===== EXAM MODAL (form) ===== */
  .exam-modal-card{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:24px;text-align:left;max-width:340px;width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .exam-modal-card h3{margin:0 0 16px;font-size:16px;font-weight:800}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .field select,.field input[type=date],.field input[type=text]{
    width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:11px 12px;border-radius:12px;font-size:14px;font-family:inherit;
  }
  .type-toggle{display:flex;gap:8px}
  .type-toggle button{
    flex:1;background:var(--card2);border:1px solid var(--line);color:var(--muted);
    padding:10px;border-radius:12px;font-size:13px;font-weight:700;transition:.15s;
  }
  .type-toggle button.active{background:rgba(94,106,210,.18);border-color:var(--accent);color:var(--accent)}
  .exam-modal-actions{display:flex;gap:10px;margin-top:20px}
  .exam-modal-actions button{
    flex:1;padding:12px;border-radius:12px;font-size:13.5px;font-weight:700;border:1px solid var(--line);
  }
  .exam-modal-actions .btn-cancel{background:var(--card2);color:var(--muted)}
  .exam-modal-actions .btn-save{background:var(--accent);border-color:var(--accent);color:#0b0b14}

  /* ===== HISTORY MODAL ===== */
  .history-modal-card{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:22px;text-align:left;max-width:360px;width:100%;max-height:80vh;
    display:flex;flex-direction:column;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .history-modal-card h3{margin:0 0 4px;font-size:16px;font-weight:800}
  .history-summary{display:flex;gap:8px;margin:14px 0}
  .history-summary .hs-item{flex:1;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
  .history-summary .hs-num{font-size:17px;font-weight:800}
  .history-summary .hs-lbl{font-size:10px;color:var(--muted);margin-top:2px}
  .history-list{overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
  .history-item{
    display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
  }
  .history-item:last-child{border-bottom:none}
  .history-item .hi-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .history-item.present .hi-dot{background:var(--green)}
  .history-item.absent .hi-dot{background:var(--red)}
  .history-item.neutral .hi-dot{background:var(--muted)}
  .history-item .hi-info{flex:1;min-width:0}
  .history-item .hi-date{font-size:13.5px;font-weight:700}
  .history-item .hi-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .history-item .hi-tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;flex-shrink:0}
  .history-item.present .hi-tag{background:rgba(34,197,94,.15);color:var(--green)}
  .history-item.absent .hi-tag{background:rgba(239,68,68,.15);color:var(--red)}

<script>
/* ============================================================
   GRADE HORÁRIA (baseada nas suas aulas)
   weekday: 1=Seg, 2=Ter, 3=Qua, 4=Qui, 5=Sex
   ============================================================ */
const SUBJECTS = {
  calc:  {name:"Cálculo e Física Aplicados à Agronomia", emoji:"📐"},
  quim:  {name:"Química Geral e Analítica", emoji:"🧪"},
  bot:   {name:"Botânica", emoji:"🌿"},
  manejo:{name:"Manejo de Viveiros e Produção de Mudas", emoji:"🌱"},
  bio:   {name:"Bioenergética e Metabolismo", emoji:"⚡"},
};

// Cada "aula" tem id único (usado no histórico), matéria, tipo, dia e horário
const SCHEDULE = [
  // Segunda
  {id:"seg-calc",   subj:"calc",   type:"Preleção",   weekday:1, time:"07:15 – 08:45", block:"BL-S", room:"SL-106"},
  {id:"seg-quim",   subj:"quim",   type:"Preleção",   weekday:1, time:"09:00 – 10:30", block:"BL-S", room:"SL-107"},
  // Terça
  {id:"ter-bot",    subj:"bot",    type:"Preleção",   weekday:2, time:"07:15 – 08:45", block:"BL-S", room:"SL-106"},
  {id:"ter-quimlab",subj:"quim",   type:"Laboratório",weekday:2, time:"09:00 – 10:30", block:"BL-G", room:"SL-107"},
  {id:"ter-botlab", subj:"bot",    type:"Laboratório",weekday:2, time:"10:45 – 12:15", block:"BL-G", room:"SL-104"},
  // Quarta
  {id:"qua-manejo1",subj:"manejo", type:"Extensão",   weekday:3, time:"07:15 – 08:45", block:"ITS",  room:null},
  {id:"qua-manejo2",subj:"manejo", type:"Extensão",   weekday:3, time:"09:00 – 10:30", block:"BL-E", room:"SL-003"},
  // Quinta
  {id:"qui-calc",   subj:"calc",   type:"Preleção",   weekday:4, time:"07:15 – 08:45", block:"BL-S", room:"SL-106"},
  {id:"qui-bio",    subj:"bio",    type:"Preleção",   weekday:4, time:"09:00 – 10:30", block:"BL-S", room:"SL-106"},
  {id:"qui-biolab", subj:"bio",    type:"Laboratório",weekday:4, time:"10:45 – 12:15", block:"BL-G", room:"SL-107"},
];

const WEEKDAY_NAMES = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const MIN_FREQ = 75;
const HOURS_PER_CLASS = 2; // cada registro (presença/falta) equivale a 2 aulas/2h

/* ============================================================
   ESTADO / STORAGE
   records = { "2026-08-31": { "seg-calc":"P", "seg-quim":"A" }, ... }
   ============================================================ */
const STORAGE_KEY = "freq_agronomia_v1";
const SEED_FLAG = "freq_agronomia_v1_seeded";
const EXAMS_KEY = "freq_agronomia_v1_exams";
const EXAM_TYPES = {prova:"Prova", atividade:"Atividade avaliativa"};
let records = {};
let exams = [];
let examTypeSel = "prova";
let current = new Date();
let viewMode = "day"; // "day" | "week"
let activeTab = "register"; // "exams" | "agenda" | "register" | "stats"

function load(){
  try{ records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ records = {}; }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

function loadExams(){
  try{ exams = JSON.parse(localStorage.getItem(EXAMS_KEY)) || []; }
  catch(e){ exams = []; }
}
function saveExams(){ localStorage.setItem(EXAMS_KEY, JSON.stringify(exams)); }

/* Preenche o histórico desde o início das aulas (10/08) até hoje.
   Só roda UMA vez (marca a flag) e nunca sobrescreve registros já existentes. */
function seedHistory(){
  if(localStorage.getItem(SEED_FLAG)) return;

  const start = new Date(2026,7,10);   // 10/08/2026
  const faultDay1 = new Date(2026,7,10); // faltou
  const faultDay2 = new Date(2026,7,11); // faltou
  const end = new Date(); end.setHours(0,0,0,0);

  let d = new Date(start);
  while(d <= end){
    const wd = d.getDay();
    const classes = SCHEDULE.filter(c=>c.weekday===wd);
    if(classes.length){
      const dayKey = keyOf(d);
      if(!records[dayKey]) records[dayKey] = {};
      const wasFaultDay = isSameDay(d,faultDay1) || isSameDay(d,faultDay2);
      classes.forEach(c=>{
        if(records[dayKey][c.id]===undefined){
          records[dayKey][c.id] = wasFaultDay ? "A" : "P";
        }
      });
    }
    d.setDate(d.getDate()+1);
  }
  save();
  localStorage.setItem(SEED_FLAG,"1");
}

function keyOf(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function isSameDay(a,b){ return keyOf(a)===keyOf(b); }

function isNowInRange(dateObj, startStr, endStr){
  if(!isSameDay(dateObj, new Date())) return false;
  const now = new Date();
  const [sh,sm] = startStr.split(":").map(Number);
  const [eh,em] = endStr.split(":").map(Number);
  const nowMin = now.getHours()*60+now.getMinutes();
  return nowMin>=(sh*60+sm) && nowMin<=(eh*60+em);
}

/* Retorna as 5 datas (Segunda a Sexta) da semana que contém d */
function getWeekDates(d){
  const wd = d.getDay(); // 0=Dom..6=Sáb
  const mondayOffset = wd===0 ? -6 : 1-wd;
  const monday = new Date(d);
  monday.setDate(d.getDate()+mondayOffset);
  const days = [];
  for(let i=0;i<5;i++){
    const dt = new Date(monday);
    dt.setDate(monday.getDate()+i);
    days.push(dt);
  }
  return days;
}

/* ============================================================
   PÁGINA 1 - REGISTRAR
   ============================================================ */
function fmtShort(d){
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
}

function renderDateBar(){
  document.getElementById("datePicker").value = keyOf(current);
  if(viewMode==="week"){
    const days = getWeekDates(current);
    document.getElementById("dDay").textContent = fmtShort(days[0])+" – "+fmtShort(days[4]);
    document.getElementById("dWeek").textContent = "Semana";
    return;
  }
  const wd = current.getDay();
  document.getElementById("dDay").textContent =
    String(current.getDate()).padStart(2,"0")+"/"+String(current.getMonth()+1).padStart(2,"0")+"/"+current.getFullYear();
  document.getElementById("dWeek").textContent = WEEKDAY_NAMES[wd];
}

function renderRegister(){
  renderDateBar();
  const wd = current.getDay();
  const dayKey = keyOf(current);
  const dayRec = records[dayKey] || {};
  const classes = SCHEDULE.filter(c=>c.weekday===wd);
  const box = document.getElementById("pageRegister");

  if(classes.length===0){
    box.innerHTML = `<div class="empty-day">Nenhuma aula neste dia.<br>Aproveite o descanso!</div>`;
    return;
  }

  const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
  const ICON_X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
  const ICON_BAN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m5.5 5.5 13 13"/></svg>`;
  const ICON_CLOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`;
  const ICON_STAR = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2Z"/></svg>`;

  const todayFlag = isSameDay(current, new Date());
  let html = `<button class="perfect-week-btn" onclick="markPerfectDay(event)">${ICON_STAR}Marcar dia perfeito</button>`;
  html += `<div class="daygroup ${todayFlag?'is-today':''}">
    <div class="dayhead">${WEEKDAY_NAMES[wd]} ${todayFlag?'<span class="pill">HOJE</span>':''}</div>`;

  classes.forEach(c=>{
    const s = SUBJECTS[c.subj];
    const st = dayRec[c.id]; // "P" | "A" | "N" | undefined
    const cls = st==="P"?"present":st==="A"?"absent":st==="N"?"neutral":"";
    const tag = st==="P"?"Presente":st==="A"?"Falta":st==="N"?"Sem aula":"";
    html += `
      <div class="cls ${cls}" id="card-${c.id}">
        <span class="status-tag">${tag}</span>
        <div class="name">${s.emoji} ${s.name}</div>
        <div class="type">${c.type}</div>
        <div class="time">${ICON_CLOCK} ${c.time}</div>
        <div class="btns">
          <button class="${st==="P"?"sel-p":""}" onclick="mark('${dayKey}','${c.id}','P')">${ICON_CHECK}Presente</button>
          <button class="${st==="A"?"sel-a":""}" onclick="mark('${dayKey}','${c.id}','A')">${ICON_X}Falta</button>
          <button class="${st==="N"?"sel-n":""}" onclick="mark('${dayKey}','${c.id}','N')">${ICON_BAN}Sem aula</button>
        </div>
      </div>`;
  });
  html += `</div>`;
  box.innerHTML = html;
  staggerIn(box, ".cls");
}

const STATUS_COLORS = {
  P:{bg:"rgba(34,197,94,.14)", fg:"#22c55e"},
  A:{bg:"rgba(239,68,68,.14)", fg:"#ef4444"},
  N:{bg:"rgba(138,143,152,.14)", fg:"#ededef"},
};

function mark(dayKey, classId, status){
  if(!records[dayKey]) records[dayKey] = {};
  // toggle: se clicar de novo no mesmo, desmarca
  let wasSet = true;
  if(records[dayKey][classId]===status){
    delete records[dayKey][classId];
    wasSet = false;
    toast("Registro removido");
  }else{
    records[dayKey][classId]=status;
    toast(status==="P"?"✓ Presença registrada":status==="A"?"✕ Falta registrada":"⊘ Marcado como sem aula");
  }
  if(Object.keys(records[dayKey]).length===0) delete records[dayKey];
  save();
  if(viewMode==="week") renderWeek(); else renderRegister();

  const cardEl = document.getElementById("card-"+classId);
  if(cardEl){
    gsap.fromTo(cardEl, {scale:1.04}, {scale:1, duration:.4, ease:"back.out(3)"});
    if(wasSet){
      const cls = status==="P"?".sel-p":status==="A"?".sel-a":".sel-n";
      const btn = cardEl.querySelector(cls);
      const c = STATUS_COLORS[status];
      if(btn) gsap.fromTo(btn, {backgroundColor:"#15161d", color:"#8a8f98"}, {backgroundColor:c.bg, color:c.fg, duration:.4, ease:"power2.out"});
    }
  }
}

/* ============================================================
   VISÃO SEMANAL
   ============================================================ */
function renderWeek(){
  renderDateBar();
  const box = document.getElementById("pageRegister");
  const days = getWeekDates(current);
  const today = new Date();

  const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
  const ICON_X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
  const ICON_BAN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m5.5 5.5 13 13"/></svg>`;
  const ICON_CLOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`;
  const ICON_STAR = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2Z"/></svg>`;

  let html = `
    <button class="perfect-week-btn" onclick="markPerfectWeek(event)">${ICON_STAR}Marcar semana perfeita</button>`;

  let hasAnyClass = false;
  days.forEach(d=>{
    const wd = d.getDay();
    const classes = SCHEDULE.filter(c=>c.weekday===wd);
    if(classes.length===0) return;
    hasAnyClass = true;
    const dayKey = keyOf(d);
    const dayRec = records[dayKey] || {};
    const todayFlag = isSameDay(d, today);

    html += `<div class="daygroup ${todayFlag?'is-today':''}">
      <div class="dayhead">${WEEKDAY_NAMES[wd]} · ${fmtShort(d)} ${todayFlag?'<span class="pill">HOJE</span>':''}</div>`;

    classes.forEach(c=>{
      const s = SUBJECTS[c.subj];
      const st = dayRec[c.id];
      const cls = st==="P"?"present":st==="A"?"absent":st==="N"?"neutral":"";
      const tag = st==="P"?"Presente":st==="A"?"Falta":st==="N"?"Sem aula":"";
      html += `
        <div class="cls ${cls}" id="card-${c.id}">
          <span class="status-tag">${tag}</span>
          <div class="name">${s.emoji} ${s.name}</div>
          <div class="type">${c.type}</div>
          <div class="time">${ICON_CLOCK} ${c.time}</div>
          <div class="btns">
            <button class="${st==="P"?"sel-p":""}" onclick="mark('${dayKey}','${c.id}','P')">${ICON_CHECK}Presente</button>
            <button class="${st==="A"?"sel-a":""}" onclick="mark('${dayKey}','${c.id}','A')">${ICON_X}Falta</button>
            <button class="${st==="N"?"sel-n":""}" onclick="mark('${dayKey}','${c.id}','N')">${ICON_BAN}Sem aula</button>
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  if(!hasAnyClass){
    html += `<div class="empty-day">Nenhuma aula nesta semana.<br>Aproveite o descanso!</div>`;
  }

  box.innerHTML = html;
  staggerIn(box, ".cls");
}

function markPerfectWeek(evt){
  const days = getWeekDates(current);
  let count = 0;
  days.forEach(d=>{
    const wd = d.getDay();
    const classes = SCHEDULE.filter(c=>c.weekday===wd);
    if(classes.length===0) return;
    const dayKey = keyOf(d);
    if(!records[dayKey]) records[dayKey] = {};
    classes.forEach(c=>{
      records[dayKey][c.id] = "P";
      count++;
    });
  });
  save();
  renderWeek();
  if(evt) burstConfetti(evt.currentTarget);
  showConfirmModal("Semana perfeita!", `${count} aula(s) marcadas como presença, sem nenhuma falta.`);
}

function markPerfectDay(evt){
  const wd = current.getDay();
  const classes = SCHEDULE.filter(c=>c.weekday===wd);
  if(classes.length===0) return;
  const dayKey = keyOf(current);
  if(!records[dayKey]) records[dayKey] = {};
  classes.forEach(c=>{ records[dayKey][c.id] = "P"; });
  save();
  renderRegister();
  if(evt) burstConfetti(evt.currentTarget);
  showConfirmModal("Dia perfeito!", `${classes.length} aula(s) marcadas como presença, sem nenhuma falta.`);
}

/* ============================================================
   CONFETE (GSAP, sem canvas)
   ============================================================ */
function burstConfetti(originEl){
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const colors = ["#facc15","#22c55e","#3b82f6","#ef4444","#818cf8","#f59e0b"];
  const container = document.createElement("div");
  container.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:90;";
  document.body.appendChild(container);

  const N = 24;
  for(let i=0;i<N;i++){
    const p = document.createElement("div");
    const size = 6 + Math.random()*5;
    p.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;
      background:${colors[i%colors.length]};border-radius:${Math.random()<.5?"50%":"3px"};`;
    container.appendChild(p);

    const angle = Math.random()*Math.PI*2;
    const dist = 80 + Math.random()*120;
    gsap.to(p, {
      x: Math.cos(angle)*dist,
      y: Math.sin(angle)*dist - 40,
      rotation: Math.random()*360,
      opacity: 0,
      duration: .7 + Math.random()*.5,
      ease: "power2.out",
      onComplete: ()=>{ p.remove(); if(container.childElementCount===0) container.remove(); }
    });
  }
}

/* ============================================================
   ANIMAÇÃO GENÉRICA DE MODAL (GSAP)
   ============================================================ */
function openModal(overlayId){
  const overlay = document.getElementById(overlayId);
  const card = overlay.firstElementChild;
  gsap.killTweensOf([overlay, card]);
  gsap.set(overlay, {pointerEvents:"auto"});
  gsap.fromTo(overlay, {opacity:0}, {opacity:1, duration:.2, ease:"power2.out"});
  gsap.fromTo(card, {scale:.85, opacity:0}, {scale:1, opacity:1, duration:.35, ease:"back.out(1.7)"});
}
function closeModal(overlayId, onDone){
  const overlay = document.getElementById(overlayId);
  const card = overlay.firstElementChild;
  gsap.killTweensOf([overlay, card]);
  gsap.to(card, {scale:.92, opacity:0, duration:.15, ease:"power1.in"});
  gsap.to(overlay, {opacity:0, duration:.2, delay:.03, ease:"power1.in", onComplete:()=>{
    gsap.set(overlay, {pointerEvents:"none"});
    if(onDone) onDone();
  }});
}

   PROVAS
   ============================================================ */
function daysUntil(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const target = new Date(y,m-1,d); target.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}

function fmtLong(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  return String(d).padStart(2,"0")+"/"+String(m).padStart(2,"0")+"/"+y;
}

function countdownLabel(diff){
  if(diff<0) return "Atrasada";
  if(diff===0) return "Hoje";
  if(diff===1) return "Amanhã";
  return `Em ${diff} dias`;
}

/* Semáforo de prioridade: <=3 dias = vermelho, 4-10 dias = amarelo, >10 dias = verde */
function examColorClass(diff){
  if(diff<=3) return "c-red";
  if(diff<=10) return "c-yellow";
  return "c-green";
}

function saveExam(){
  const subj = document.getElementById("examSubj").value;
  const date = document.getElementById("examDate").value;
  const note = document.getElementById("examNote").value.trim();

    ex.subj = subj; ex.date = date; ex.type = examTypeSel; ex.note = note;

/* ============================================================
   PÁGINA 2 - ESTATÍSTICAS
   ============================================================ */
function computeStats(){
  // por matéria: presenças e faltas somando todo o histórico
  const acc = {};
  Object.keys(SUBJECTS).forEach(k=>acc[k]={p:0,a:0});
  Object.values(records).forEach(day=>{
    Object.entries(day).forEach(([classId,st])=>{
      const cls = SCHEDULE.find(c=>c.id===classId);
      if(!cls) return;
      if(st==="P") acc[cls.subj].p++;
      else if(st==="A") acc[cls.subj].a++;
    });
  });
  return acc;
}

/* ============================================================
   HISTÓRICO POR MATÉRIA (quadros clicáveis das Estatísticas)
   ============================================================ */
function getSubjectHistory(subjKey){
  const entries = [];
  Object.entries(records).forEach(([dateKey,dayRec])=>{
    Object.entries(dayRec).forEach(([classId,status])=>{
      const cls = SCHEDULE.find(c=>c.id===classId);
      if(!cls || cls.subj!==subjKey) return;
      entries.push({date:dateKey, status, type:cls.type, time:cls.time});
    });
  });
  entries.sort((a,b)=> b.date.localeCompare(a.date));
  return entries;
}

function openSubjectHistory(subjKey){
  const s = SUBJECTS[subjKey];
  const entries = getSubjectHistory(subjKey);

  document.getElementById("historyTitle").textContent = `${s.emoji} ${s.name}`;

  const p = entries.filter(e=>e.status==="P").length;
  const a = entries.filter(e=>e.status==="A").length;
  const n = entries.filter(e=>e.status==="N").length;
  document.getElementById("historySummary").innerHTML = `
    <div class="hs-item"><div class="hs-num" style="color:var(--green)">${p}</div><div class="hs-lbl">Presenças</div></div>
    <div class="hs-item"><div class="hs-num" style="color:var(--red)">${a}</div><div class="hs-lbl">Faltas</div></div>
    <div class="hs-item"><div class="hs-num" style="color:var(--muted)">${n}</div><div class="hs-lbl">Sem aula</div></div>`;

  const box = document.getElementById("historyList");
  if(entries.length===0){
    box.innerHTML = `<div class="empty-day">Nenhum registro ainda pra essa matéria.</div>`;
  }else{
    box.innerHTML = entries.map(e=>{
      const cls = e.status==="P"?"present":e.status==="A"?"absent":"neutral";
      const label = e.status==="P"?"Presente":e.status==="A"?"Falta":"Sem aula";
      return `
        <div class="history-item ${cls}">
          <span class="hi-dot"></span>
          <div class="hi-info">
            <div class="hi-date">${fmtLong(e.date)}</div>
            <div class="hi-meta">${e.type} · ${e.time}</div>
          </div>
          <span class="hi-tag">${label}</span>
        </div>`;
    }).join("");
  }

  openModal("historyModal");
}
function closeSubjectHistory(){
  closeModal("historyModal");
}

function renderStats(){
  const acc = computeStats();
  const box = document.getElementById("pageStats");

  let totP=0,totA=0;
  Object.values(acc).forEach(v=>{totP+=v.p;totA+=v.a;});
  // converte para aulas/horas (cada registro = HOURS_PER_CLASS aulas)
  totP*=HOURS_PER_CLASS; totA*=HOURS_PER_CLASS;
  const totTotal = totP+totA;
  const totPct = totTotal? (totP/totTotal*100):0;

  let html = `
    <div class="overview">
      <h2>Frequência Geral</h2>
      <div class="ov-big" id="ovBigPct" data-target="${totTotal?totPct:0}" style="color:${colorFor(totPct,totTotal)}">${totTotal?"0":"–"}<small>%</small></div>
      <div class="ov-grid">
        <div class="ov-item"><div class="num" style="color:var(--green)">${totP}</div><div class="lbl">Presenças</div></div>
        <div class="ov-item"><div class="num" style="color:var(--red)">${totA}</div><div class="lbl">Faltas</div></div>
        <div class="ov-item"><div class="num">${totTotal}</div><div class="lbl">Aulas</div></div>
      </div>
    </div>`;

  Object.keys(SUBJECTS).forEach(k=>{
    const s = SUBJECTS[k];
    const {p,a} = acc[k];
    // cada registro (card marcado) equivale a HOURS_PER_CLASS aulas/horas
    const pH = p*HOURS_PER_CLASS, aH = a*HOURS_PER_CLASS;
    const total = pH+aH;
    const pct = total? (pH/total*100):0;
    const color = colorFor(pct,total);
    // quantas aulas (já em horas) ainda pode faltar mantendo >=75%
    // margem: enquanto pH/(pH+aH+x) >= 0.75  ->  x <= (pH/0.75) - pH - aH
    let canMiss = Math.floor((pH/(MIN_FREQ/100)) - pH - aH);
    if(canMiss<0) canMiss=0;

    let situClass="n", situTxt="Sem registros";
    if(total>0){
      if(pct>=80){situClass="g";situTxt="🟢 Situação segura";}
      else if(pct>=MIN_FREQ){situClass="y";situTxt="🟡 Atenção – perto do limite";}
      else {situClass="r";situTxt="🔴 Abaixo de 75% – risco de reprovação";}
    }

    html += `
      <div class="stat" onclick="openSubjectHistory('${k}')">
        <div class="top">
          <div class="mname">${s.emoji} ${s.name}</div>
          <div class="pct" data-target="${total?pct:0}" style="color:${color}">${total?"0%":"–"}</div>
        </div>
        <div class="bar"><div class="bar-fill" data-target="${total?pct:0}" style="width:0%;background:${color}"></div></div>
        <div class="meta">
          <span>✅ Presenças: <b>${pH}</b> aulas</span>
          <span>❌ Faltas: <b>${aH}</b> aulas</span>
        </div>
        <div class="situ ${situClass}">${situTxt}</div>
        ${total>0 && pct>=MIN_FREQ ? `<div class="meta" style="margin-top:8px"><span>Ainda pode faltar <b>${canMiss}</b> aula(s) seguindo assim</span></div>`:``}
        <div class="tap-hint">Toque para ver o histórico</div>
      </div>`;
  });

  // Ferramentas
  const ICON_DOWNLOAD = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>`;
  html += `
    <div class="tools">
      <button onclick="exportPDF()">${ICON_DOWNLOAD}Exportar PDF</button>
    </div>
    <div style="text-align:center;color:var(--muted);font-size:11px;margin-top:14px">
      Frequência mínima exigida: ${MIN_FREQ}% · Dados salvos neste navegador
    </div>`;

  box.innerHTML = html;
  staggerIn(box, ".stat");
  animateStatsNumbers(box);
}

function animateCount(el, target, suffix){
  const obj = {v:0};
  gsap.to(obj, {v:target, duration:.9, delay:.1, ease:"power2.out", onUpdate:()=>{
    el.innerHTML = Math.round(obj.v)+suffix;
  }});
}

function animateStatsNumbers(box){
  const ovBig = box.querySelector("#ovBigPct");
  if(ovBig && ovBig.textContent!=="–"){
    animateCount(ovBig, parseFloat(ovBig.dataset.target), "<small>%</small>");
  }
  box.querySelectorAll(".pct").forEach(el=>{
    if(el.textContent==="–") return;
    animateCount(el, parseFloat(el.dataset.target), "%");
  });
  box.querySelectorAll(".bar-fill").forEach(el=>{
    const target = parseFloat(el.dataset.target);
    gsap.to(el, {width:target+"%", duration:.9, delay:.1, ease:"power2.out"});
  });
}

function colorFor(pct,total){
  if(!total) return "var(--muted)";
  if(pct>=80) return "var(--green)";
  if(pct>=MIN_FREQ) return "var(--yellow)";
  return "var(--red)";
}

const TAB_INFO = {
  exams:   {title:"Provas",              sub:"Lembretes de provas e atividades avaliativas", hasDateWrap:false},

function switchTab(tab){
  activeTab = tab;
  Object.keys(TAB_INFO).forEach(t=>{
    document.getElementById("page"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("active", t===tab);
    document.getElementById("tab"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("active", t===tab);
  });
  const info = TAB_INFO[tab];
  document.getElementById("dateWrap").style.display = info.hasDateWrap?"block":"none";

  document.getElementById("hSub").textContent = info.sub;

function staggerIn(container, selector){
  const els = container.querySelectorAll(selector);
  if(!els.length) return;
  gsap.killTweensOf(els);
  gsap.from(els, {opacity:0, y:14, duration:.35, stagger:.05, ease:"power2.out"});
}

function animateTabIn(tab){
  const el = document.getElementById("page"+tab.charAt(0).toUpperCase()+tab.slice(1));
  gsap.killTweensOf(el);
  gsap.fromTo(el, {opacity:0, y:10}, {opacity:1, y:0, duration:.35, ease:"power2.out"});

  const icon = document.querySelector("#tab"+tab.charAt(0).toUpperCase()+tab.slice(1)+" svg");
  if(icon){
    gsap.killTweensOf(icon);
    gsap.fromTo(icon, {scale:1.4}, {scale:1, duration:.5, ease:"elastic.out(1,.5)"});
  }
}

function switchView(mode){
  viewMode = mode;
  document.getElementById("viewDay").classList.toggle("active", mode==="day");
  document.getElementById("viewWeek").classList.toggle("active", mode==="week");
  const activeBtn = document.getElementById(mode==="day"?"viewDay":"viewWeek");
  gsap.killTweensOf(activeBtn);
  gsap.fromTo(activeBtn, {scale:.92}, {scale:1, duration:.35, ease:"back.out(3)"});
  renderCurrentView();
}

/* ============================================================
   FERRAMENTAS
   ============================================================ */
function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 14;
  let y = 18;

  const acc = computeStats();
  let totP=0,totA=0;
  Object.values(acc).forEach(v=>{totP+=v.p;totA+=v.a;});
  totP*=HOURS_PER_CLASS; totA*=HOURS_PER_CLASS;
  const totTotal = totP+totA;
  const totPct = totTotal?(totP/totTotal*100):0;

  const now = new Date();
  const generatedAt = String(now.getDate()).padStart(2,"0")+"/"+String(now.getMonth()+1).padStart(2,"0")+"/"+now.getFullYear()+
    " "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");

  doc.setFont("helvetica","bold");
  doc.setFontSize(18);
  doc.setTextColor(20,20,20);
  doc.text("Relatório de Frequência", marginX, y);
  y += 6;
  doc.setFont("helvetica","normal");
  doc.setFontSize(9);
  doc.setTextColor(120,120,120);
  doc.text(`Gerado em ${generatedAt}`, marginX, y);
  y += 10;

  function sectionTitle(text){
    doc.setFont("helvetica","bold");
    doc.setFontSize(13);
    doc.setTextColor(20,20,20);
    doc.text(text, marginX, y);
    y += 2;
    doc.setDrawColor(20,20,20);
    doc.setLineWidth(0.5);
    doc.line(marginX, y, pageW-marginX, y);
    y += 7;
  }

  // ===== Resumo geral =====
  sectionTitle("Resumo geral");
  const boxes = [
    {label:"Frequência geral", value: totTotal?totPct.toFixed(0)+"%":"–"},
    {label:"Presenças", value: String(totP)},
    {label:"Faltas", value: String(totA)},
    {label:"Aulas registradas", value: String(totTotal)},
  ];
  const boxW = (pageW - marginX*2 - 3*4)/4, boxH = 16;
  boxes.forEach((b,i)=>{
    const x = marginX + i*(boxW+4);
    doc.setDrawColor(200,200,200);
    doc.roundedRect(x, y, boxW, boxH, 2, 2);
    doc.setFont("helvetica","bold");
    doc.setFontSize(14);
    doc.setTextColor(20,20,20);
    doc.text(b.value, x+boxW/2, y+8, {align:"center"});
    doc.setFont("helvetica","normal");
    doc.setFontSize(7);
    doc.setTextColor(120,120,120);
    doc.text(b.label, x+boxW/2, y+13, {align:"center"});
  });
  y += boxH + 10;

  // ===== Por matéria =====
  sectionTitle("Por matéria");
  Object.keys(SUBJECTS).forEach(k=>{
    const s = SUBJECTS[k];
    const {p,a} = acc[k];
    const pH = p*HOURS_PER_CLASS, aH = a*HOURS_PER_CLASS;
    const total = pH+aH;
    const pct = total?(pH/total*100):0;
    let situTxt = "Sem registros", color = [140,140,140];
    if(total>0){
      if(pct>=80){situTxt="Situação segura"; color=[34,150,80];}
      else if(pct>=MIN_FREQ){situTxt="Atenção – perto do limite"; color=[200,120,10];}
      else {situTxt="Abaixo de 75% – risco de reprovação"; color=[200,40,40];}
    }

    const cardH = 22;
    if(y + cardH > pageH - 15){ doc.addPage(); y = 18; }

    doc.setDrawColor(210,210,210);
    doc.roundedRect(marginX, y, pageW-marginX*2, cardH, 2, 2);

    doc.setFont("helvetica","bold");
    doc.setFontSize(10.5);
    doc.setTextColor(20,20,20);
    doc.text(s.name, marginX+4, y+7);
    doc.setTextColor(color[0],color[1],color[2]);
    doc.text(total?pct.toFixed(0)+"%":"–", pageW-marginX-4, y+7, {align:"right"});

    const barX = marginX+4, barY = y+9.5, barW = pageW-marginX*2-8, barH = 1.6;
    doc.setFillColor(235,235,235);
    doc.roundedRect(barX, barY, barW, barH, 0.8, 0.8, "F");
    if(total>0){
      doc.setFillColor(color[0],color[1],color[2]);
      doc.roundedRect(barX, barY, barW*(pct/100), barH, 0.8, 0.8, "F");
    }

    doc.setFont("helvetica","normal");
    doc.setFontSize(8.5);
    doc.setTextColor(90,90,90);
    doc.text(`Presenças: ${pH} aulas    Faltas: ${aH} aulas`, marginX+4, y+15.5);
    doc.setTextColor(color[0],color[1],color[2]);
    doc.text(situTxt, marginX+4, y+19.5);

    y += cardH + 4;
  });

  // ===== Histórico completo =====
  y += 4;
  if(y + 20 > pageH - 15){ doc.addPage(); y = 18; }
  sectionTitle("Histórico completo");

  const STATUS_LABEL = {P:"Presente", A:"Falta", N:"Sem aula"};
  const historyRows = [];
  Object.entries(records).forEach(([dateKey,dayRec])=>{
    Object.entries(dayRec).forEach(([classId,status])=>{
      const cls = SCHEDULE.find(c=>c.id===classId);
      if(!cls) return;
      historyRows.push({dateKey, subj:SUBJECTS[cls.subj].name, type:cls.type, time:cls.time, status});
    });
  });
  historyRows.sort((a,b)=> a.dateKey.localeCompare(b.dateKey));

  if(historyRows.length===0){
    doc.setFont("helvetica","normal");
    doc.setFontSize(9);
    doc.setTextColor(140,140,140);
    doc.text("Nenhum registro ainda.", marginX, y+4);
  }else{
    doc.autoTable({
      startY: y,
      margin: {left:marginX, right:marginX, bottom:15},
      head: [["Data","Matéria","Tipo","Horário","Status"]],
      body: historyRows.map(r=>[fmtLong(r.dateKey), r.subj, r.type, r.time, STATUS_LABEL[r.status]]),
      styles: {fontSize:8, cellPadding:2.2, textColor:[40,40,40]},
      headStyles: {fillColor:[235,235,235], textColor:[20,20,20], fontStyle:"bold"},
      alternateRowStyles: {fillColor:[248,248,248]},
      theme: "grid",
    });
  }

  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFont("helvetica","normal");
    doc.setFontSize(8);
    doc.setTextColor(150,150,150);
    doc.text(`Frequência mínima exigida: ${MIN_FREQ}%`, pageW/2, pageH-8, {align:"center"});
  }

  doc.save("frequencia_relatorio.pdf");
  toast("PDF gerado");
}
/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  gsap.set(t, {xPercent:-50});
  gsap.killTweensOf(t);
  gsap.fromTo(t, {y:20, opacity:0, scale:.9}, {y:0, opacity:1, scale:1, duration:.4, ease:"back.out(2)"});
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    gsap.to(t, {y:10, opacity:0, scale:.95, duration:.25, ease:"power1.in"});
  }, 1600);
}

/* ============================================================
   EVENTOS DE DATA
   ============================================================ */
function renderCurrentView(){
  if(activeTab==="stats"){ renderStats(); return; }
  if(activeTab==="exams"){ renderExams(); return; }
  if(activeTab==="agenda"){ viewMode==="week" ? renderAgendaWeek() : renderAgendaDay(); return; }
  viewMode==="week" ? renderWeek() : renderRegister();
}

document.getElementById("prevDay").onclick=()=>{current.setDate(current.getDate()-(viewMode==="week"?7:1));renderCurrentView();};
document.getElementById("nextDay").onclick=()=>{current.setDate(current.getDate()+(viewMode==="week"?7:1));renderCurrentView();};
document.getElementById("goToday").onclick=()=>{current=new Date();renderCurrentView();toast("Hoje");};
document.getElementById("datePicker").onchange=e=>{
  const [y,m,d]=e.target.value.split("-").map(Number);
  current=new Date(y,m-1,d); renderCurrentView();
};

/* ============================================================
   INIT
   ============================================================ */
load();
loadExams();
seedHistory();
renderRegister();
</script>
